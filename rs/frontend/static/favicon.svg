<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <title>pickup</title>
  <defs>
    <!-- Favicon viewports are tiny: at tab scale the strings,
         halftone and hatch are sub-pixel noise, so drop them. -->
    <style>
      @media (max-width: 24px) { .fine { display: none; } }
    </style>
    <clipPath id="tile"><rect width="32" height="32" rx="6"/></clipPath>

    <!-- Torn paper scrap -->
    <clipPath id="paper">
      <polygon points="3,4.2 9,2.6 15.5,3.6 22.8,2.2 29,3.9 28.2,11 29.7,18 28.3,25.6 29.2,29.4 21,28 14,29.7 8,28.1 3.1,29.2 4,21 2.5,14 3.7,9"/>
    </clipPath>

    <!-- Pickup halves (in the tilted frame), used to flip strings to white on the black -->
    <clipPath id="pup">
      <polygon points="3.6,9.2 19.2,8.7 19.5,15.1 3.9,15.5"/>
      <polygon points="12.4,17.1 28.2,16.6 28.4,23 12.7,23.4"/>
    </clipPath>

    <!-- Four loose, uneven strings -->
    <g id="strings" class="fine" fill="none" stroke-linecap="round">
      <path d="M6.3 -3 L6.6 12 L6.2 36"    stroke-width="1.1"/>
      <path d="M11.8 -3 L12.1 14 L11.7 36" stroke-width="0.95"/>
      <path d="M19.9 -3 L19.5 17 L19.9 36" stroke-width="0.8"/>
      <path d="M25.6 -3 L25.9 18 L25.5 36" stroke-width="0.65"/>
    </g>
  </defs>

  <g clip-path="url(#tile)">
    <!-- Black ground -->
    <rect width="32" height="32" fill="#0a0a0a"/>

    <!-- Paper scrap, pasted down slightly crooked -->
    <g transform="rotate(-9 16 16)">
      <polygon fill="#f4f1e8"
        points="3,4.2 9,2.6 15.5,3.6 22.8,2.2 29,3.9 28.2,11 29.7,18 28.3,25.6 29.2,29.4 21,28 14,29.7 8,28.1 3.1,29.2 4,21 2.5,14 3.7,9"/>

      <g clip-path="url(#paper)">
        <!-- Halftone patch -->
        <g class="fine" fill="#0a0a0a">
          <circle cx="5.2" cy="27.2" r="0.75"/><circle cx="7.2" cy="27.2" r="0.6"/><circle cx="9.2" cy="27.2" r="0.45"/><circle cx="11.2" cy="27.2" r="0.3"/>
          <circle cx="6.2" cy="25.4" r="0.6"/><circle cx="8.2" cy="25.4" r="0.45"/><circle cx="10.2" cy="25.4" r="0.3"/>
          <circle cx="5.2" cy="23.6" r="0.5"/><circle cx="7.2" cy="23.6" r="0.35"/>
        </g>
        <!-- Scratchy hatch marks -->
        <path class="fine" d="M24.5 26.8 L27.6 24.6 M25.8 28.4 L28.8 26.2 M26.8 6 L28.4 4.4" stroke="#0a0a0a" stroke-width="0.6" stroke-linecap="round" fill="none"/>

        <!-- Tilted split-coil pickup + strings -->
        <g transform="translate(16 16) rotate(38) scale(0.78) translate(-16 -16)">
          <g fill="#0a0a0a" stroke="#0a0a0a" stroke-width="0.7" stroke-linejoin="round">
            <polygon points="3.6,9.2 19.2,8.7 19.5,15.1 3.9,15.5"/>
            <polygon points="12.4,17.1 28.2,16.6 28.4,23 12.7,23.4"/>
          </g>
          <g fill="#f4f1e8">
            <circle cx="8.6" cy="12.3" r="1.3"/>
            <circle cx="14.2" cy="12" r="1.25"/>
            <circle cx="17.4" cy="20.2" r="1.3"/>
            <circle cx="23.2" cy="19.9" r="1.25"/>
          </g>
          <!-- black on paper, white where they cross the pickup -->
          <use href="#strings" stroke="#0a0a0a"/>
          <use href="#strings" stroke="#f4f1e8" clip-path="url(#pup)"/>
        </g>
      </g>

      <!-- Strip of tape holding it down -->
      <rect x="0.5" y="3" width="8" height="3.2" fill="#d8d3c4" stroke="#0a0a0a" stroke-width="0.4" transform="rotate(-38 4.5 4.6)"/>
    </g>
  </g>
</svg>
