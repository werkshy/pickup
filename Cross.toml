# rodio links against alsa on linux targets, and cross's images don't ship
# the target architecture's alsa dev headers. This is the cross-rs recipe
# for adding system packages:
# https://github.com/cross-rs/cross/wiki/Recipes
#
# Note there's no entry for armv5te-unknown-linux-gnueabi: modern ubuntu has
# no armel packages, so we can't link alsa for that target.

[target.aarch64-unknown-linux-gnu]
pre-build = [
    "dpkg --add-architecture $CROSS_DEB_ARCH",
    "apt-get update && apt-get install --assume-yes libasound2-dev:$CROSS_DEB_ARCH",
]

[target.armv7-unknown-linux-gnueabihf]
pre-build = [
    "dpkg --add-architecture $CROSS_DEB_ARCH",
    "apt-get update && apt-get install --assume-yes libasound2-dev:$CROSS_DEB_ARCH",
]
