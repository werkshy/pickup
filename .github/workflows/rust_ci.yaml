name: Rust CI

on:
  push:
    branches: [$default-branch]
  pull_request:

defaults:
  run:
    shell: bash

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - name: install libraries
        run: |
          sudo apt update
          sudo apt install -y libasound2-dev pulseaudio
      # Plain ALSA fails in CI since there's no real device.
      # I copied the pulseaudio trick from pulseaudio-rs CI config.
      # https://github.com/colinmarc/pulseaudio-rs/blob/main/.github/workflows/tests.yaml
      - name: Setup pulseaudio
        run: |
          systemctl --user enable pulseaudio
          systemctl --user start pulseaudio
          pactl load-module module-null-sink sink_name=test_sink
          pactl set-default-sink test_sink
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-test-${{ hashFiles('**/Cargo.lock') }}
      - name: Update rust toolchain
        run: |
          rustup update
          rustup component add clippy
      - name: "Check format"
        run: cargo fmt -- --check
      - name: "Run clippy linter"
        run: cargo clippy --no-deps -- -Dwarnings
      - name: "Run tests"
        run: cargo test
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: e2e/package-lock.json
      # The browser tests drive a real Chromium; --with-deps installs the
      # system libraries Chromium needs (libnspr4, libnss3, libatk, ...).
      - name: "Install e2e dependencies"
        run: |
          npm ci
          npx playwright install --with-deps chromium
        working-directory: e2e
      - name: "Run browser tests"
        run: npx playwright test
        working-directory: e2e
