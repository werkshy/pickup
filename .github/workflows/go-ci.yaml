name: Go CI

on:
  push:
    branches: [$default-branch]
  pull_request:
    paths-ignore:
      - rs/**

jobs:
  build:
    runs-on: ubuntu-latest

    defaults:
      run:
        shell: bash
        working-directory: ./go

    steps:
      - uses: actions/checkout@v7
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24.x
          cache-dependency-path: go/frontend/yarn.lock
      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: 1.27
          cache-dependency-path: go/go.sum
      # We don't have it setup in the Makefile to avoid double-building, but 'make lint'
      # requires the react build to have completed.
      - run: make frontend

      - run: make lint

      - name: Go build (Linux, AMD64)
        run: go build -o pickup.$GOOS.$GOARCH
        env:
          GOOS: linux
          GOARCH: amd64
      - name: "Upload Artifact"
        uses: actions/upload-artifact@v7
        with:
          name: pickup (Linux, AMD64)
          path: go/pickup.linux.amd64

      - name: Go build (Linux, ARM5)
        run: go build -o pickup.$GOOS.$GOARCH$GOARM
        env:
          GOOS: linux
          GOARCH: arm
          GOARM: 5
      - name: "Upload Artifact"
        uses: actions/upload-artifact@v7
        with:
          name: pickup (Linux, ARM5)
          path: go/pickup.linux.arm5

      - name: Go build (Darwin, ARM5)
        run: go build -o pickup.$GOOS.$GOARCH
        env:
          GOOS: darwin
          GOARCH: amd64
      - name: "Upload Artifact"
        uses: actions/upload-artifact@v7
        with:
          name: pickup (Darwin, AMD64)
          path: go/pickup.darwin.amd64

      - name: Go build (Darwin, ARM64)
        run: go build -o pickup.$GOOS.$GOARCH
        env:
          GOOS: darwin
          GOARCH: arm64
      - name: "Upload Artifact"
        uses: actions/upload-artifact@v7
        with:
          name: pickup (Darwin, ARM64)
          path: go/pickup.darwin.arm64
