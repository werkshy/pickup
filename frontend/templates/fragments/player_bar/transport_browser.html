{# Both pause and play are always rendered; the player script shows
   the one matching the <audio> element's state. #}
<button id="transport-play" class="transport-button" title="Play">&#9654;</button>
<button id="transport-pause" class="transport-button" title="Pause" hidden>&#10074;&#10074;</button>
<button id="transport-skip" class="transport-button" title="Next track">&#9197;</button>
<button id="transport-stop" class="transport-button" title="Stop">&#9632;</button>
<span id="progress"></span>
